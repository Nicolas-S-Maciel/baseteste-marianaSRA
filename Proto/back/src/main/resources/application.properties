spring.application.name=mariana

# Porta da aplicação (8080 localmente, ou a porta dinâmica injetada pelo Render/Nuvem via $PORT)
server.port=${PORT:8080}

# Banco de dados flexível:
# 1. Nuvem (Render/Railway): usa a URL passada pela variável de ambiente SPRING_DATASOURCE_URL.
# 2. Local: caso não haja variável, usa H2 persistido em arquivo (pasta ./data/) para rodar imediatamente.
# 3. Caso queira usar MySQL local: basta descomentar o bloco MySQL abaixo e comentar o H2.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/mariano_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# --- Para usar MySQL local, descomente as linhas abaixo e comente o bloco acima ---
# spring.datasource.url=jdbc:mysql://localhost:3306/mariano_db?serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=sua_senha_aqui
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Atualiza as tabelas automaticamente baseado no seu código Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console H2 (opcional: acesse http://localhost:8080/h2-console para visualizar o banco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
