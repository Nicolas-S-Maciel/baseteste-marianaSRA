<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<!-- Fragmentos compartilhados pelas páginas (head, cabeçalho e rodapé) -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Endpoint real do PresencaController; os scripts leem daqui -->
    <meta name="api-url" th:content="@{/api/frequencia/registrar}">
    <title th:text="${titulo} + ' | MarianaSRA'">MarianaSRA</title>
    <link rel="icon" type="image/jpeg" th:href="@{/img/logo-senai.jpg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<header th:fragment="cabecalho(titulo, linkTexto, linkUrl)"
        class="flex min-h-[86px] items-center justify-between gap-4 border-b-[5px] border-senai-blue bg-senai-red px-5 py-[18px] max-sm:flex-col max-sm:items-start sm:px-[max(24px,calc((100%-1180px)/2))] print:hidden">
    <h1 class="text-[1.35rem] font-bold tracking-[0.01em] text-white sm:text-[1.65rem]" th:text="${titulo}">Título</h1>
    <a th:href="${linkUrl}" th:text="${linkTexto}"
       class="border border-white/80 px-3.5 py-2.5 text-sm font-bold text-white no-underline hover:bg-white hover:text-senai-red focus-visible:bg-white focus-visible:text-senai-red">Link</a>
</header>

<footer th:fragment="rodape" class="bg-senai-blue px-6 py-[18px] text-center text-[0.82rem] text-white print:hidden">
    <p>&copy; 2026 Senai. Todos os direitos reservados.</p>
</footer>

</body>
</html>
